<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>indeep</title>

<!-- =====================================================================
     WEBSITE KOMUNITAS — SATU HALAMAN (HTML + CSS + JS, tanpa library)
     Semua teks, link, dan gambar diatur di bagian "KONFIGURASI UTAMA".
     ===================================================================== -->

<style>
:root {
  --bg: #0a0a0a; --bg-2: #121212; --card: #1c1c1c; --card-2: #2a2a2a;
  --border: #2a2a2a; --text: #e5e5e5; --text-2: #d4d4d4; --muted: #a3a3a3;
  --online: #3ba55d; --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

/* ================== NAVIGASI ================== */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,0.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1000px; margin: 0 auto; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; height: 56px;
}
.nav-logo { font-weight: 700; font-size: 15px; letter-spacing: .5px; color: var(--text-2); white-space: nowrap; }
.nav-tabs { position: relative; display: flex; gap: 4px; overflow-x: auto; }
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  padding: 10px 14px; font-size: 14px; color: var(--muted);
  border-radius: 8px; white-space: nowrap; background: none; border: none;
  cursor: pointer; font-family: inherit; transition: color .2s, background .2s;
}
.nav-tab:hover { color: var(--text); background: var(--card); }
.nav-tab.active { color: var(--text); font-weight: 600; }
/* garis penanda yang bergeser antar tab */
.nav-indicator {
  position: absolute; bottom: 0; height: 2px; border-radius: 2px;
  background: var(--text-2);
  transition: left .35s cubic-bezier(.4,0,.2,1), width .35s cubic-bezier(.4,0,.2,1);
}

/* ================== PANEL & ANIMASI ================== */
.page { max-width: 1000px; margin: 0 auto; padding: 0 16px 64px; }
.panel { display: none; }
.panel.active { display: block; animation: panelIn .45s cubic-bezier(.2,.7,.2,1); }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
  to   { opacity: 1; transform: none; filter: none; }
}
.panel-pad { padding-top: 32px; }

/* ================== HOME ================== */
.banner-wrap { position: relative; margin-bottom: 44px; }
.banner {
  width: 100%; height: 320px; object-fit: cover;
  border-radius: 0 0 var(--radius) var(--radius); background: var(--card);
}
.profile-row {
  position: absolute; left: 24px; right: 24px; bottom: -44px;
  display: flex; align-items: flex-end; gap: 16px;
}
.avatar {
  width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
  border: 4px solid var(--bg); background: var(--card-2);
}
.profile-meta { padding-bottom: 6px; }
.profile-meta h1 { font-size: 22px; line-height: 1.2; }
.member-count { font-size: 13px; color: var(--muted); margin-top: 2px; }
.btn {
  display: inline-block; padding: 9px 22px; border-radius: 999px;
  background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px;
  border: none; cursor: pointer; transition: opacity .2s, transform .15s;
}
.btn:hover { opacity: .85; transform: translateY(-1px); }
.join-btn { margin-left: auto; margin-bottom: 6px; }

.section-title { margin: 36px 0 20px; font-size: 20px; }
.about-row { display: flex; align-items: center; gap: 28px; margin-bottom: 32px; }
.about-row.reverse { flex-direction: row-reverse; }
.about-photo { flex: 0 0 46%; max-width: 46%; }
.about-photo img {
  width: 100%; height: auto; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--card);
}
.about-text { flex: 1; }
.about-text h3 { font-size: 17px; margin-bottom: 8px; }
.about-text p { font-size: 14px; color: var(--text-2); }

/* ================== KARTU PREVIEW (Discord/TikTok) ================== */
.preview {
  max-width: 480px; margin: 0 auto; background: var(--card);
  border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
}
.preview-banner { height: 120px; background: var(--card-2); width: 100%; object-fit: cover; }
.preview-body { padding: 0 20px 22px; }
.preview-icon {
  width: 80px; height: 80px; border-radius: 22px; margin-top: -40px;
  border: 5px solid var(--card); background: var(--card-2); object-fit: cover;
}
.preview-icon.round { border-radius: 50%; width: 96px; height: 96px; margin-top: -48px; }
.preview h2 { font-size: 20px; margin-top: 10px; }
.preview .sub { font-size: 13px; color: var(--muted); }
.preview .desc { font-size: 14px; color: var(--text-2); margin: 12px 0 16px; }
.stats { display: flex; gap: 18px; font-size: 13px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.stats b { color: var(--text); font-size: 15px; margin-right: 4px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.dot.on { background: var(--online); }
.dot.all { background: var(--muted); }
.preview .btn { width: 100%; text-align: center; }
.sync-note { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; }

/* ================== NEWS ================== */
.news-list { display: grid; gap: 20px; }
.news-card {
  display: flex; gap: 20px; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  transition: border-color .2s, transform .2s;
}
.news-card:hover { border-color: #3a3a3a; transform: translateY(-2px); }
.news-card img { flex: 0 0 38%; max-width: 38%; object-fit: cover; background: var(--card-2); }
.news-body { padding: 18px 18px 18px 0; }
.news-date { font-size: 12px; color: var(--muted); }
.news-body h3 { font-size: 17px; margin: 4px 0 8px; }
.news-body p { font-size: 14px; color: var(--text-2); }

/* ================== MAINTENANCE ================== */
.maint-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
.maint-card {
  max-width: 480px; width: 100%; text-align: center;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 40px 28px;
  animation: panelIn .45s cubic-bezier(.2,.7,.2,1);
}
.maint-icon {
  width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%;
  background: var(--card-2); display: flex; align-items: center; justify-content: center;
  font-size: 28px; animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.maint-card h1 { font-size: 22px; margin-bottom: 12px; }
.maint-card p { font-size: 14px; color: var(--text-2); margin-bottom: 10px; }
.maint-status {
  display: inline-block; font-size: 12px; color: var(--muted);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 14px; margin-bottom: 16px;
}
.maint-card .btn { margin-top: 6px; }

/* ================== RESPONSIF ================== */
@media (max-width: 768px) {
  .banner { height: 250px; }
  .banner-wrap { margin-bottom: 52px; }
  .profile-row { position: static; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: -48px; padding-left: 16px; }
  .avatar { width: 84px; height: 84px; }
  .join-btn { margin: 6px 0 0; }
  .about-row, .about-row.reverse { flex-direction: column; align-items: stretch; }
  .about-photo { flex: none; max-width: 100%; order: -1; }
  .news-card { flex-direction: column; gap: 0; }
  .news-card img { max-width: 100%; aspect-ratio: 16/9; }
  .news-body { padding: 16px; }
}
@media (max-width: 480px) {
  .nav-logo { font-size: 13px; }
  .nav-tab { padding: 10px; font-size: 13px; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <span class="nav-logo" id="navLogo"></span>
    <div class="nav-tabs" id="navTabs"></div>
  </div>
</nav>

<main class="page">

  <!-- ================== HOME ================== -->
  <section class="panel active" id="panel-home">
    <div class="banner-wrap">
      <img class="banner" id="bannerImg" alt="Banner komunitas">
      <div class="profile-row">
        <img class="avatar" id="profileImg" alt="Foto profil komunitas">
        <div class="profile-meta">
          <h1 id="communityName"></h1>
          <div class="member-count" id="memberCount"></div>
        </div>
        <a class="btn join-btn" id="joinBtn" target="_blank" rel="noopener">Join</a>
      </div>
    </div>
    <h2 class="section-title">About</h2>
    <div id="aboutList"></div>
  </section>

  <!-- ================== DISCORD ================== -->
  <section class="panel panel-pad" id="panel-discord">
    <div class="preview">
      <img class="preview-banner" id="dcBanner" alt="">
      <div class="preview-body">
        <img class="preview-icon" id="dcIcon" alt="Ikon server">
        <h2 id="dcName"></h2>
        <div class="stats">
          <span><span class="dot on"></span><b id="dcOnline">–</b>Online</span>
          <span><span class="dot all"></span><b id="dcMembers">–</b>Member</span>
        </div>
        <p class="desc" id="dcDesc"></p>
        <a class="btn" id="dcJoin" target="_blank" rel="noopener">Join Server</a>
        <div class="sync-note" id="dcNote">Memuat data server…</div>
      </div>
    </div>
  </section>

  <!-- ================== TIKTOK ================== -->
  <section class="panel panel-pad" id="panel-tiktok">
    <div class="preview">
      <img class="preview-banner" id="ttBanner" alt="">
      <div class="preview-body">
        <img class="preview-icon round" id="ttAvatar" alt="Foto profil TikTok">
        <h2 id="ttName"></h2>
        <div class="sub" id="ttHandle"></div>
        <div class="stats">
          <span><b id="ttFollowing"></b>Following</span>
          <span><b id="ttFollowers"></b>Followers</span>
          <span><b id="ttLikes"></b>Likes</span>
        </div>
        <p class="desc" id="ttBio"></p>
        <a class="btn" id="ttFollow" target="_blank" rel="noopener">Follow on TikTok</a>
      </div>
    </div>
  </section>

  <!-- ================== NEWS ================== -->
  <section class="panel panel-pad" id="panel-news">
    <h2 class="section-title" style="margin-top:0">News</h2>
    <div class="news-list" id="newsList"></div>
  </section>

  <!-- ================== MAINTENANCE ================== -->
  <section class="panel" id="panel-maintenance">
    <div class="maint-wrap">
      <div class="maint-card">
        <div class="maint-icon">🔧</div>
        <h1 id="maintTitle"></h1>
        <div class="maint-status" id="maintStatus"></div>
        <p id="maintMsg"></p>
        <p id="maintBug"></p>
        <a class="btn" id="maintContact" target="_blank" rel="noopener">Lapor Bug via Discord</a>
      </div>
    </div>
  </section>

</main>

<script>
/* =====================================================================
   KONFIGURASI UTAMA — edit bagian ini saja
   ===================================================================== */
const CONFIG = {
  name: "deep garage",
  memberCount: "554 member",        // dipakai kalau data Discord gagal dimuat
  bannerUrl: "asset/banner.png",
  profileUrl: "asset/indeep.png",

  about: [
    { title: "meet every week!", text: "Tulis deskripsi singkat tentang foto ini di sini.", image: "asset/meetws.png" },
    { title: "make your car better", text: "Tulis deskripsi singkat tentang foto ini di sini.", image: "asset/gt86.png" },
    { title: "customize anything", text: "Tulis deskripsi singkat tentang foto ini di sini.", image: "asset/erogsoy.png" },
  ],

  // --- Discord: kode invite (bagian akhir link discord.gg/XXXX) ---
  // Jumlah member & online diambil otomatis dari Discord.
  discord: {
    invite: "fXEBuMyWv2",
    description: "Server komunitas indeep — ngobrol, sharing edit, dan event bareng.",
  },

  // --- TikTok: isi manual (TikTok tidak menyediakan data publik otomatis) ---
  tiktok: {
    username: "deep.garage",
    displayName: "indeep",
    banner: "asset/bannertiktok.png",
    avatar: "asset/indeep.png",                       // kosong = pakai profileUrl
    following: "94",
    followers: "359",
    likes: "16.6k",
    bio: "hit your limits",
  },

  // --- News: tambah/hapus item sesuka hati ---
  news: [
    { date: "5 Sep 2026", title: "create america map in slotcar", text: "status: work in progress", image: "asset/mapscapemay.png" },
    { date: "21 Okt 2026", title: "make new rims for bike", text: "status: work in progress", image: "asset/rimsnews.jpg" },
  ],

  // --- Mode perawatan: ubah "enabled" ke true untuk menampilkan halaman perawatan ---
  maintenance: {
    enabled: false,
    title: "Sedang Dalam Perawatan",
    status: "Maintenance · Kembali beberapa saat",
    message: "Kami sedang merapikan beberapa bagian website. Coba buka lagi nanti ya!",
    bugNote: "Menemukan Masalah? Laporkan lewat Discord di bawah, akan segera kami perbaiki.",
  },
};
/* ===================== AKHIR KONFIGURASI ===================== */

function placeholder(w, h, label) {
  const svg =
    `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>` +
    `<rect width='100%' height='100%' fill='#1c1c1c'/>` +
    `<text x='50%' y='50%' fill='#5a5a5a' font-family='Arial' font-size='16'` +
    ` text-anchor='middle' dominant-baseline='middle'>${label}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
const $ = id => document.getElementById(id);
const discordUrl = "https://discord.gg/" + CONFIG.discord.invite;
const tiktokUrl = "https://www.tiktok.com/@" + CONFIG.tiktok.username;

/* ---------- Mode perawatan (kalau CONFIG.maintenance.enabled = true) ---------- */
const M = CONFIG.maintenance || {};
const MAINT_ON = !!M.enabled;
if (MAINT_ON) {
  document.querySelector(".nav-tabs").style.display = "none";
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  $("panel-maintenance").classList.add("active");
  $("maintTitle").textContent = M.title || "Sedang Dalam Perawatan";
  $("maintStatus").textContent = M.status || "";
  $("maintMsg").textContent = M.message || "";
  $("maintBug").textContent = M.bugNote || "";
  $("maintContact").href = discordUrl;
}

/* ---------- Tab (tetap di halaman ini, dengan animasi) ---------- */
$("navLogo").textContent = CONFIG.name;
const TABS = ["Home", "Discord", "TikTok", "News"];
const tabsEl = $("navTabs");
tabsEl.innerHTML = TABS.map(t =>
  `<button class="nav-tab" data-tab="${t.toLowerCase()}">${t}</button>`).join("") +
  `<span class="nav-indicator" id="navIndicator"></span>`;

function showTab(key, push = true) {
  if (!TABS.map(t => t.toLowerCase()).includes(key)) key = "home";
  document.querySelectorAll(".nav-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === key));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + key));
  const btn = tabsEl.querySelector(`[data-tab="${key}"]`);
  const ind = $("navIndicator");
  ind.style.left = (btn.offsetLeft + 14) + "px";
  ind.style.width = (btn.offsetWidth - 28) + "px";
  if (push) history.replaceState(null, "", key === "home" ? location.pathname : "#" + key);
  window.scrollTo({ top: 0, behavior: "smooth" });
}
tabsEl.addEventListener("click", e => {
  const b = e.target.closest(".nav-tab");
  if (b) showTab(b.dataset.tab);
});
window.addEventListener("resize", () => { const a = document.querySelector(".nav-tab.active"); if (a && !MAINT_ON) showTab(a.dataset.tab, false); });

/* ---------- Home ---------- */
$("bannerImg").src = CONFIG.bannerUrl || placeholder(1200, 320, "BANNER");
$("profileImg").src = CONFIG.profileUrl || placeholder(200, 200, "FOTO");
$("communityName").textContent = CONFIG.name;
$("memberCount").textContent = CONFIG.memberCount;
$("joinBtn").href = discordUrl;
$("aboutList").innerHTML = CONFIG.about.map((a, i) =>
  `<div class="about-row${i % 2 === 1 ? " reverse" : ""}">
     <div class="about-text"><h3>${a.title}</h3><p>${a.text}</p></div>
     <div class="about-photo"><img src="${a.image || placeholder(640, 420, "FOTO " + (i + 1))}" alt="${a.title}" loading="lazy"></div>
   </div>`).join("");

/* ---------- Discord (jumlah member sinkron dari Discord) ---------- */
$("dcName").textContent = CONFIG.name;
$("dcDesc").textContent = CONFIG.discord.description;
$("dcJoin").href = discordUrl;
$("dcIcon").src = CONFIG.profileUrl || placeholder(80, 80, "ICON");
$("dcBanner").src = CONFIG.bannerUrl || placeholder(480, 120, "");
const fmt = n => Number(n).toLocaleString("id-ID");

async function syncDiscord() {
  try {
    const r = await fetch(`https://discord.com/api/v10/invites/${CONFIG.discord.invite}?with_counts=true`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const g = d.guild || {};
    if (g.name) $("dcName").textContent = g.name;
    if (g.description) $("dcDesc").textContent = g.description;
    if (g.icon) $("dcIcon").src = `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=160`;
    if (g.banner) $("dcBanner").src = `https://cdn.discordapp.com/banners/${g.id}/${g.banner}.png?size=600`;
    $("dcMembers").textContent = fmt(d.approximate_member_count);
    $("dcOnline").textContent = fmt(d.approximate_presence_count);
    $("memberCount").textContent = fmt(d.approximate_member_count) + " member";
    $("dcNote").textContent = "Data langsung dari Discord · diperbarui " +
      new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  } catch {
    $("dcNote").textContent = "Gagal memuat data Discord (cek internet / link invite).";
  }
}
syncDiscord();
setInterval(syncDiscord, 60000);   // perbarui tiap 1 menit

/* ---------- TikTok (profil saja, tanpa postingan) ---------- */
const tt = CONFIG.tiktok;
$("ttAvatar").src = tt.avatar || CONFIG.profileUrl || placeholder(96, 96, "FOTO");
$("ttBanner").src = tt.banner || placeholder(480, 120, "");
$("ttName").textContent = tt.displayName;
$("ttHandle").textContent = "@" + tt.username;
$("ttFollowing").textContent = tt.following;
$("ttFollowers").textContent = tt.followers;
$("ttLikes").textContent = tt.likes;
$("ttBio").textContent = tt.bio;
$("ttFollow").href = tiktokUrl;

/* ---------- News ---------- */
$("newsList").innerHTML = CONFIG.news.map((n, i) =>
  `<article class="news-card">
     <img src="${n.image || placeholder(640, 360, "GAMBAR " + (i + 1))}" alt="${n.title}" loading="lazy">
     <div class="news-body">
       <div class="news-date">${n.date}</div>
       <h3>${n.title}</h3>
       <p>${n.text}</p>
     </div>
   </article>`).join("");

/* Buka tab sesuai hash (#discord, #tiktok, #news) */
if (!MAINT_ON) showTab(location.hash.slice(1) || "home", false);
</script>
</body>
</html>
