<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>indeep</title>

<!-- =====================================================================
     WEBSITE KOMUNITAS — SATU HALAMAN (HTML + CSS + JS, tanpa library)
     ---------------------------------------------------------------------
     CARA GANTI ISI:
     Semua teks, link, dan gambar diatur di bagian "KONFIGURASI" di bawah
     (cari tulisan "KONFIGURASI UTAMA"). Cukup edit nilai di sana,
     tidak perlu menyentuh kode di bawahnya.

     GANTI GAMBAR:
     Isi URL gambar Anda pada bannerUrl, profileUrl, dan thumbnail
     (bagian "edits"). Contoh: "https://situs-saya.com/banner.jpg"
     Sementara ini memakai placeholder abu-abu yang dibuat langsung
     oleh kode, jadi website tetap tampil rapi walau offline.
     ===================================================================== -->

<style>
/* ================== WARNA & DASAR ================== */
:root {
  --bg: #0a0a0a;            /* latar halaman */
  --bg-2: #121212;          /* latar sekunder */
  --card: #1c1c1c;          /* kartu */
  --card-2: #2a2a2a;        /* kartu / border lebih terang */
  --border: #2a2a2a;
  --text: #e5e5e5;          /* teks utama */
  --text-2: #d4d4d4;        /* teks sekunder */
  --muted: #a3a3a3;         /* teks redup */
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

/* ================== NAVIGASI (STICKY) ================== */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 10, 10, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}

.nav-inner {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: 56px;
}

.nav-logo {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.5px;
  color: var(--text-2);
  white-space: nowrap;
}

.nav-tabs { display: flex; gap: 4px; overflow-x: auto; }
.nav-tabs::-webkit-scrollbar { display: none; }

/* Tab: garis bawah muncul saat aktif */
.nav-tab {
  position: relative;
  padding: 10px 14px;
  font-size: 14px;
  color: var(--muted);
  border-radius: 8px;
  white-space: nowrap;
  transition: color 0.2s ease, background 0.2s ease;
}
.nav-tab:hover { color: var(--text); background: var(--card); }
.nav-tab.active { color: var(--text); font-weight: 600; }
.nav-tab.active::after {
  content: "";
  position: absolute;
  left: 14px; right: 14px; bottom: 0;
  height: 2px;
  background: var(--text-2);   /* penanda abu terang */
  border-radius: 2px;
}

/* ================== HALAMAN HOME ================== */
.page { max-width: 1000px; margin: 0 auto; padding: 0 16px 64px; }

/* 1) Banner */
.banner-wrap { position: relative; margin-bottom: 44px; }
.banner {
  width: 100%;
  height: 320px;               /* 250–350px */
  object-fit: cover;
  border-radius: 0 0 var(--radius) var(--radius);
  background: var(--card);
}

/* 2) Profil + nama + member + tombol Join */
.profile-row {
  position: absolute;
  left: 24px;
  bottom: -44px;
  display: flex;
  align-items: flex-end;
  gap: 16px;
}
.avatar {
  width: 96px; height: 96px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--bg);
  background: var(--card-2);
}
.profile-meta { padding-bottom: 6px; }
.profile-meta h1 { font-size: 22px; line-height: 1.2; }
.member-count { font-size: 13px; color: var(--muted); margin-top: 2px; }

.join-btn {
  margin-left: auto;
  margin-bottom: 6px;
  padding: 9px 22px;
  border-radius: 999px;
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
  font-size: 14px;
  border: none;
  cursor: pointer;
  transition: opacity 0.2s ease, transform 0.15s ease;
}
.join-btn:hover { opacity: 0.85; transform: translateY(-1px); }


/* 3) About — foto + deskripsi berselang-seling */
.section-title {
  margin: 36px 0 20px;
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.about-row {
  display: flex;
  align-items: center;
  gap: 28px;
  margin-bottom: 32px;
}
/* Foto 1 & 3: deskripsi di kiri, foto di kanan.
   Foto 2: sebaliknya (foto di kiri) via .reverse */
.about-row.reverse { flex-direction: row-reverse; }

.about-photo { flex: 0 0 46%; max-width: 46%; }
.about-photo img {
  width: 100%;
  height: auto;                /* rasio asli foto dipertahankan */
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--card);
}

.about-text { flex: 1; }
.about-text h3 { font-size: 17px; margin-bottom: 8px; }
.about-text p { font-size: 14px; color: var(--text-2); }


/* ================== RESPONSIF (MOBILE) ================== */
@media (max-width: 768px) {
  .banner { height: 250px; }
  .banner-wrap { margin-bottom: 52px; }

  /* Profil memindah ke bawah banner, susun vertikal */
  .profile-row {
    position: static;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    margin-top: -48px;
  }
  .avatar { width: 84px; height: 84px; }
  .join-btn { margin: 6px 0 0; }

  /* About: foto ditumpuk di atas deskripsi */
  .about-row { flex-direction: column; align-items: stretch; }
  .about-row.reverse { flex-direction: column; }
  .about-photo { flex: none; max-width: 100%; order: -1; }
}
@media (max-width: 480px) {
  .nav-logo { font-size: 13px; }
  .nav-tab { padding: 10px 10px; font-size: 13px; }
}
</style>
</head>
<body>

<!-- ================== NAVIGASI ================== -->
<nav class="nav">
  <div class="nav-inner">
    <span class="nav-logo" id="navLogo"></span>
    <div class="nav-tabs" id="navTabs"><!-- diisi oleh JS --></div>
  </div>
</nav>

<!-- ================== HOME ================== -->
<main class="page">

  <!-- 1) Banner -->
  <div class="banner-wrap">
    <img class="banner" id="bannerImg" alt="Banner komunitas">
    <!-- 2) Foto profil, nama, jumlah member, tombol Join -->
    <div class="profile-row">
      <img class="avatar" id="profileImg" alt="Foto profil komunitas">
      <div class="profile-meta">
        <h1 id="communityName"></h1>
        <div class="member-count" id="memberCount"></div>
      </div>
      <a class="join-btn" id="joinBtn" target="_blank" rel="noopener">Join</a>
    </div>
  </div>

  <!-- 3) About — foto + deskripsi berselang-seling -->
  <h2 class="section-title">About</h2>
  <div id="aboutList"><!-- baris foto diisi oleh JS --></div>

</main>

<script>
/* =====================================================================
   KONFIGURASI UTAMA — edit bagian ini saja
   ===================================================================== */
const CONFIG = {

  // --- Identitas komunitas ---
  name: "deep garage",              // ganti dengan nama komunitas Anda
  memberCount: "554 member",          // jumlah member (bebas formatnya)

  // --- Gambar (ganti URL di bawah dengan gambar Anda sendiri) ---
  bannerUrl: "asset/banner.png",
  profileUrl: "asset/profile.png",                     

  // --- About: foto + deskripsi singkat ---
  // "image": URL foto (kosong = placeholder abu-abu). Rasio asli foto dipertahankan.
  about: [
    { title: "Foto 1", text: "Tulis deskripsi singkat tentang foto ini di sini.", image: "" },
    { title: "Foto 2", text: "Tulis deskripsi singkat tentang foto ini di sini.", image: "" },
    { title: "Foto 3", text: "Tulis deskripsi singkat tentang foto ini di sini.", image: "" },
  ],

  // --- Link tab & tombol (ganti dengan link asli komunitas Anda) ---
  links: {
    discord: "https://discord.gg/fXEBuMyWv2",   // placeholder — ganti
    tiktok:  "https://www.tiktok.com/@deep.garage",   // placeholder — ganti
    news:    "https://contoh.com/news",          // placeholder — ganti
  },

};
/* =====================================================================
   AKHIR KONFIGURASI — kode di bawah tidak perlu diubah
   ===================================================================== */

// Placeholder abu-abu yang dibuat otomatis (SVG), dipakai kalau URL kosong.
// Ini supaya file bisa dibuka tanpa internet dan gambarnya mudah diganti.
function placeholder(w, h, label) {
  const svg =
    `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>` +
    `<rect width='100%' height='100%' fill='#1c1c1c'/>` +
    `<text x='50%' y='50%' fill='#5a5a5a' font-family='Arial' font-size='16'` +
    ` text-anchor='middle' dominant-baseline='middle'>${label}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

// --- Nav: logo + tab ---
document.getElementById("navLogo").textContent = CONFIG.name;

const tabs = [
  { label: "Home",    href: "#",     active: true },          // tab halaman ini
  { label: "Discord", href: CONFIG.links.discord, external: true },
  { label: "TikTok",  href: CONFIG.links.tiktok,  external: true },
  { label: "News",    href: CONFIG.links.news,    external: true },
];
document.getElementById("navTabs").innerHTML = tabs.map(t =>
  `<a class="nav-tab${t.active ? " active" : ""}" href="${t.href}"
      ${t.external ? 'target="_blank" rel="noopener"' : ""}>${t.label}</a>`
).join("");

// --- Banner, profil, nama, member, Join ---
const bannerImg = document.getElementById("bannerImg");
bannerImg.src = CONFIG.bannerUrl || placeholder(1200, 320, "BANNER — ganti URL di CONFIG");
if (CONFIG.bannerUrl) bannerImg.alt = "Banner " + CONFIG.name;

const profileImg = document.getElementById("profileImg");
profileImg.src = CONFIG.profileUrl || placeholder(200, 200, "FOTO");
if (CONFIG.profileUrl) profileImg.alt = "Profil " + CONFIG.name;

document.getElementById("communityName").textContent = CONFIG.name;
document.getElementById("memberCount").textContent = CONFIG.memberCount;

const joinBtn = document.getElementById("joinBtn");
joinBtn.href = CONFIG.links.discord;   // tombol Join diarahkan ke Discord

// --- About: bangun baris foto + deskripsi (selang-seling kiri/kanan) ---
document.getElementById("aboutList").innerHTML = CONFIG.about.map((a, i) =>
  `<div class="about-row${i % 2 === 1 ? " reverse" : ""}">
     <div class="about-text">
       <h3>${a.title}</h3>
       <p>${a.text}</p>
     </div>
     <div class="about-photo">
       <img src="${a.image || placeholder(640, 420, "FOTO " + (i + 1))}" alt="${a.title}" loading="lazy">
     </div>
   </div>`
).join("");
</script>
</body>
</html>
